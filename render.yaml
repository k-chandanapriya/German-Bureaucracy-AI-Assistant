# Render Blueprint for Briefly's backend (https://render.com/docs/blueprint-spec).
# The website itself is on GitHub Pages; see .github/workflows/pages.yml.
services:
  - type: web
    name: briefly-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false # you paste it in the Render dashboard; never commit it
      - key: CORS_ORIGINS
        value: https://k-chandanapriya.github.io
      # Each letter read costs a few cents of Claude usage: cap it.
      - key: MAX_READS_PER_DAY
        value: "30"
      - key: MAX_READS_PER_IP_PER_DAY
        value: "5"
      - key: ADOPT_UNOWNED_CASES
        value: "false"
